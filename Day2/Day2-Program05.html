<!DOCTYPE html>
<html>
<head>
    <title>Nested Elements</title>
</head>
<body>
<div class="container">

    <h1>My Profile</h1>

    <p>
        My name is
        <strong>
            <em>Pratiksha</em>
        </strong>
        Patil.
    </p>

    <p>
        I am learning
        <mark>HTML</mark>
        and
        <mark>CSS</mark>.
    </p>

</div>
</body>
</html>
