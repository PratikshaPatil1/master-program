<!DOCTYPE html>

<head>
    <title>HTML Documentation</title>

<body>

    
<h1>HTML Basic Syntax</h1>

<p>
    HTML elements normally contain an
    <strong>opening tag</strong> and a
    <strong>closing tag</strong>.
</p>

<p>
    Example:
</p>

<p>
    &lt;p&gt;Hello World&lt;/p&gt;
</p>

<p>
    Here, <b>&lt;p&gt;</b> is the opening tag
    and <b>&lt;/p&gt;</b> is the closing tag.
</p>

<p>
    HTML &amp; CSS are commonly used together.
</p>
</body>
</html>
