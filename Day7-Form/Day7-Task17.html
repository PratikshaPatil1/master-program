<!DOCTYPE html>
<html>
    <head>
        <title>
            Doctor Appointment Form</title>
        </title>
    </head>
    <body>
        <h1> Doctor Appointment Form</h1>

        <form>
            <label>Patient Name:</label>
            <input type="text" name="patientname" placeholder="Enter patient name"required>
            <br><br>

            <label>Gender:</label>
            <input type="radio" name="gender" value="Male">Male
            <input type="radio" name="gender" value="Female">Female
            <input type="radio" name="gender" value="Other">Other
            <br><br>

            <label>Mobile No:</label>
            <input type="tel" name="mobile" placeholder="Enter your mobile number">
            <br>
            <br>

            <lable>Email:</lable>
            <input type="email" name="email" placeholder="Enter email">
            <br>
            <br>

            <label>Department:</label>
            <select name="department">
                 <option>-- Select Department --</option> 
                 <option>Cardiology</option>
                  <option>Dermatology</option> 
                  <option>Orthopedics</option>
                   <option>General Medicine</option> 
                   <option>Pediatrics</option>
                </select>
                 <br><br>

                 <label>Doctor:</label>
                 <input type="text" name="doctor" placeholder="Enter doctor name">
                 <br><br>

                 <label>Appointment Date:</label>
                 <input type="date" name="date" >
                 <br><br>

                 <lable>Appointment Time:</lable>
                 <input type="time" name="time">
                 <br>
                 <br>

                 <lable>Problem Description:</lable>
                 <br>
                 <textarea name="problem" rows="6" cols="40" placeholder="Describe your problem"></textarea>
                 <br>
                 <br>

                 <input type="submit" value="Book Appointment">
                 </form>
                     
                </body>
                </html>
    </body>
</html
