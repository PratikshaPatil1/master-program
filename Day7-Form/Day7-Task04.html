<!DOCTYPE html>
 <html> 
    <head> 
        <title>Feedback Form</title>
     </head> 
     <body> 
        <h1>Customer Feedback Form</h1>
         <form> 
            <label>Name:</label> 
            <input type="text" name="name" placeholder="Enter your name" required> 
            <br><br> 
            <label>Email:</label> 
            <input type="email" name="email" placeholder="Enter your email" required> 
            <br><br>
             <label>Overall Experience:</label>
              <br>
             <input type="radio" name="experience" value="Excellent"> Excellent
              <br> 
            <input type="radio" name="experience" value="Good"> Good 
            <br>
            <input type="radio" name="experience" value="Average"> Average 
            <br>
         <input type="radio" name="experience" value="Poor"> Poor 
         <br><br>
          <label>Services Used:</label>
           <br> 
           <input type="checkbox" name="services" value="Delivery"> Delivery 
           <br> 
           <input type="checkbox" name="services" value="Customer Support"> Customer Support 
           <br> 
           <input type="checkbox" name="services" value="Online Service"> Online Service 
           <br>
           <input type="checkbox" name="services" value="Payment"> Payment 
           <br><br>
           <label>Comments:</label> 
           <br> 
           <textarea name="comments" rows="5" cols="40" placeholder="Write your comments"></textarea>
            <br><br>
             <input type="submit" value="Submit">
              <input type="reset" value="Reset">
             </form> 
            </body> 
            </html>
