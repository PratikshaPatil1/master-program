<!DOCTYPE html> 
<html> 
    <head> 
        <title>Employee Registration Form</title>
     </head> 
     <body> 
        <h1>Employee Registration Form</h1> 
        <form>
             <label>Employee ID:</label> 
             <input type="text" name="employeeid" placeholder="Enter employee ID" required> 
             <br><br> 
             <label>Employee Name:</label>
              <input type="text" name="employeename" placeholder="Enter employee name" required> 
              <br><br> 
              <label>Email:</label>
               <input type="email" name="email" placeholder="Enter email" required> <br><br>
                <label>Password:</label> 
                <input type="password" name="password" placeholder="Enter password" required>
                 <br><br>
                  <label>Department:</label> 
                  <select name="department"> 
                    <option value="">-- Select Department --</option> 
                    <option value="IT">IT</option>
                     <option value="HR">HR</option>
                      <option value="Finance">Finance</option> 
                      <option value="Marketing">Marketing</option> 
                      <option value="Sales">Sales</option> 
                    </select> 
                    <br><br>
                     <label>Designation:</label> 
                     <input type="text" name="designation" placeholder="Enter designation"> 
                     <br><br>
                      <label>Gender:</label>
                       <input type="radio" name="gender" value="Male"> Male
                        <input type="radio" name="gender" value="Female"> Female 
                        <input type="radio" name="gender" value="Other"> Other 
                        <br><br> 
                        <label>Skills:</label> 
                        <br> 
                        <input type="checkbox" name="skills" value="HTML"> HTML 
                        <input type="checkbox" name="skills" value="CSS"> CSS
                         <input type="checkbox" name="skills" value="Java"> Java 
                         <input type="checkbox" name="skills" value="Python"> Python
                          <input type="checkbox" name="skills" value="SQL"> SQL 
                          <br><br> 
                          <label>Experience:</label>
                           <input type="number" name="experience" placeholder="Years of experience">
                            <br><br>
                             <label>Address:</label> 
                             <br>
                              <textarea name="address" rows="5" cols="40" placeholder="Enter your address"></textarea> 
                              <br><br> 
                              <input type="submit" value="Submit"> 
                            </form> 
                        </body> 
                </html>
