<!DOCTYPE html>
<html>
<head>
    <title>Insurance Registration Form</title>
</head>
<body>

    <h1>Insurance Enquiry Form</h1>

    <form>

        <label>Customer Name:</label>
        <input type="text" name="customername"
               placeholder="Enter customer name" required>
        <br><br>

        <label>Age:</label>
        <input type="number" name="age"
               placeholder="Enter your age">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <label>Email:</label>
        <input type="email" name="email"
               placeholder="Enter email" required>
        <br><br>

        <label>Mobile:</label>
        <input type="tel" name="mobile"
               placeholder="Enter mobile number" required>
        <br><br>

        <label>Insurance Type:</label>
        <br>
        <input type="radio" name="insurance" value="Health">
        Health
        <br>
        <input type="radio" name="insurance" value="Life">
        Life
        <br>
        <input type="radio" name="insurance" value="Vehicle">
        Vehicle
        <br>
        <input type="radio" name="insurance" value="Travel">
        Travel
        <br><br>

        <label>Occupation:</label>
        <input type="text" name="occupation"
               placeholder="Enter occupation">
        <br><br>

        <label>City:</label>
        <input type="text" name="city"
               placeholder="Enter city">
        <br><br>

        <label>Message:</label>
        <br>
        <textarea name="message" rows="6" cols="40"
                  placeholder="Enter your message"></textarea>
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
