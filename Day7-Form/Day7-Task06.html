<!DOCTYPE html> 
<html> 
    <head>
         <title>Job Application Form</title>
         </head>
          <body> 
            <h1>Job Application Form</h1> 
            <form>
                 <label>Full Name:</label> 
                 <input type="text" name="fullname" placeholder="Enter your full name" required> 
                 <br><br>
                  <label>Email:</label>
                   <input type="email" name="email" placeholder="Enter your email" required>
                    <br><br>
                     <label>Mobile:</label> 
                     <input type="tel" name="mobile" placeholder="Enter mobile number" required> 
                     <br><br> 
                     <label>Date of Birth:</label> 
                     <input type="date" name="dob">
                      <br><br>
                      <label>Gender:</label>
                       <input type="radio" name="gender" value="Male"> Male
                       <input type="radio" name="gender" value="Female"> Female 
                       <input type="radio" name="gender" value="Other"> Other 
                       <br><br> 
                       <label>Qualification:</label>
                        <select name="qualification">
                             <option value="">-- Select Qualification --</option> 
                             <option value="B.E">B.E</option>
                              <option value="B.Tech">B.Tech</option>
                               <option value="BCA">BCA</option> 
                               <option value="MCA">MCA</option> 
                               <option value="M.Tech">M.Tech</option> 
                            </select>
                             <br><br>
                              <label>Experience:</label>
                               <input type="number" name="experience" placeholder="Years of experience"> 
                               <br><br> 
                               <label>Skills:</label>
                                <br>
                                 <input type="checkbox" name="skills" value="HTML"> HTML 
                                 <input type="checkbox" name="skills" value="CSS"> CSS
                                  <input type="checkbox" name="skills" value="JavaScript"> JavaScript 
                                  <input type="checkbox" name="skills" value="Java"> Java 
                                  <input type="checkbox" name="skills" value="Python"> Python 
                                  <br><br> 
                                  <label>Preferred Location:</label> 
                                  <select name="location"> <option value="">-- Select Location --</option>
                                     <option value="Pune">Pune</option>
                                      <option value="Mumbai">Mumbai</option>
                                       <option value="Bangalore">Bangalore</option> 
                                       <option value="Hyderabad">Hyderabad</option> 
                                    </select>
                                     <br><br>
                                      <label>Employment Type:</label>
                                       <br> 
                                       <input type="radio" name="employment" value="Full Time"> Full Time 
                                       <input type="radio" name="employment" value="Part Time"> Part Time 
                                       <input type="radio" name="employment" value="Internship"> Internship 
                                       <br><br>
                                        <label>Address:</label> 
                                        <br> 
                                        <textarea name="address" rows="5" cols="40" placeholder="Enter your address"></textarea> 
                                        <br><br> 
                                        <label>Upload Resume:</label> 
                                        <input type="file" name="resume">
                                         <br><br> 
                                         <input type="submit" value="Submit"> 
                                         <input type="reset" value="Reset">
                                         </form> 
                                        </body> 
                                    </html>
