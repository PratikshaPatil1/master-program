<!DOCTYPE html>
<html>
<head>
    <title>Employee Feedback Form</title>
</head>
<body>

    <h1>Employee Feedback Form</h1>

    <form>

        <label>Employee Name:</label>
        <input type="text" name="name"
               placeholder="Enter employee name">
        <br><br>

        <label>Department:</label>
        <input type="text" name="department"
               placeholder="Enter department">
        <br><br>

        <label>Job Satisfaction:</label>
        <select name="job_satisfaction">
            <option>-- Select Rating --</option>
            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
        </select>
        <br><br>

        <label>Work Environment:</label>
        <select name="environment">
            <option>-- Select Rating --</option>
            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
        </select>
        <br><br>

        <label>Management Support:</label>
        <select name="management">
            <option>-- Select Rating --</option>
            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
        </select>
        <br><br>

        <label>Training Satisfaction:</label>
        <select name="training">
            <option>-- Select Rating --</option>
            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
        </select>
        <br><br>

        <label>Suggestions:</label>
        <br>
        <textarea name="suggestions" rows="6" cols="40"
                  placeholder="Enter your suggestions"></textarea>
        <br><br>

        <input type="checkbox" name="anonymous">
        <label>Anonymous Feedback</label>
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
