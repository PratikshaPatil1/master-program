<!DOCTYPE html> 
<html> 
    <head> 
        <title>Product Search Form</title> 
    </head> 
    <body>
         <h1>Product Search</h1>
          <form> 
            <label>Search Product:</label>
             <input type="text" name="product" placeholder="Search product"> 
             <br><br> 
             <label>Category:</label> 
             <select name="category"> 
                <option>-- Select Category --</option> 
                <option>Electronics</option>
                 <option>Clothing</option> 
                 <option>Mobiles</option>
                  <option>Laptops</option> 
                  <option>Shoes</option> 
                  <option>Books</option>
                 </select> 
                 <br><br> 
                 <label>Brand:</label> 
                 <select name="brand"> 
                    <option>-- Select Brand --</option> 
                    <option>Samsung</option> 
                    <option>Apple</option> 
                    <option>Nike</option> 
                    <option>Adidas</option>
                     <option>HP</option> 
                    </select> 
                    <br><br>
                     <label>Minimum Price:</label>
                      <input type="number" name="minprice" placeholder="Minimum price"> <br><br> <label>Maximum Price:</label> <input type="number" name="maxprice" placeholder="Maximum price">
                       <br><br>
                        <input type="submit" value="Search"> 
                    </form>
                 </body>
             </html>
