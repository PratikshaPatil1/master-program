<!DOCTYPE html>
<html>
<head>
    <title>Product Review Form</title>
</head>
<body>

    <h1>Product Review Form</h1>

    <form>

        <label>Customer Name:</label>
        <input type="text" name="name"
               placeholder="Enter your name">
        <br><br>

        <label>Email:</label>
        <input type="email" name="email"
               placeholder="Enter your email">
        <br><br>

        <label>Product Name:</label>
        <input type="text" name="product"
               placeholder="Enter product name">
        <br><br>

        <label>Rating:</label>
        <br>
        <input type="radio" name="rating" value="1"> 1 Star
        <br>
        <input type="radio" name="rating" value="2"> 2 Stars
        <br>
        <input type="radio" name="rating" value="3"> 3 Stars
        <br>
        <input type="radio" name="rating" value="4"> 4 Stars
        <br>
        <input type="radio" name="rating" value="5"> 5 Stars
        <br><br>

        <label>Review:</label>
        <br>
        <textarea name="review" rows="6" cols="40"
                  placeholder="Write your review"></textarea>
        <br><br>

        <label>Recommend Product?</label>
        <br>
        <input type="radio" name="recommend" value="Yes"> Yes
        <input type="radio" name="recommend" value="No"> No
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
