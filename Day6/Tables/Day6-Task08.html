<!DOCTYPE html> 
<html>
     <head>
         <title>Restaurant Bill</title> 
        </head>
         <body> 
            <h1>Restaurant Order Bill</h1>
             <table border="1"> 
                <thead>
                     <tr> 
                        <th>Item</th>
                         <th>Quantity</th> 
                         <th>Price</th>
                          <th>Amount</th>
                         </tr>
                         </thead> 
                         <tbody> 
                            <tr>
                                <td>Pizza</td>
                                <td>2</td>
                                <td>300</td>
                                <td>600</td>
                            </tr>
                             <tr>
                                <td>Burger</td>
                                <td>2</td>
                                <td>150</td>
                                <td>300</td>
                            </tr>
                             <tr>
                                <td>Cold Coffee</td>
                                <td>2</td>
                                <td>120</td>
                                <td>240</td>
                            </tr>
                         </tbody> 
                         <tfoot>
                             <tr>
                                <th colspan="3">Subtotal</th>
                                <td>1140</td>
                            </tr> 
                            <tr>
                                <th colspan="3">GST</th>
                                <td>205</td>
                            </tr> 
                            <tr>
                                <th colspan="3">Discount</th>
                                <td>100</td>
                            </tr>
                             <tr>
                                <th colspan="3">Grand Total</th>
                                <th>1245</th>
                            </tr>
                         </tfoot>
                         </table>
                         </body> 
                         </html>
