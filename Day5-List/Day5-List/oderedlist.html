<html>
    <head>
        <title>
           Oderlist  
        </title>
        <style>
            body {
                background-color: blueviolet;
                font-family: Arial, Helvetica, sans-serif;
                padding: 30px;
            }
            h1{
                color:chartreuse;
                text-align: center;
            }
            ol{
                background-color: cornsilk;
                width: 400;
                margin: auto;
                padding: 25px 40px;
                border:2px solid brown ;
                border-radius: 10px;
            }

            li{
                padding: 10px;
                margin: 5px;
                background-color: lightblue;
                border-radius: 5px;
            }
            li:hover{

                background-color: crimson;
            }

            
        </style>
    </head>
<body>

    <h1>
        Steps to make tea
    </h1>
    <ol>
      <li>Boil water</li>
      <li>Add tea powder</li>
      <li>Add milk</li>
      <li>Add sugar</li>
      <li>Serve tea</li>   
    </ol>
</body>
</html>
