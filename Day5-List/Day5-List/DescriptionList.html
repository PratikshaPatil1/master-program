<html>
    <head>
        <title>
            Description List
        </title>
        <style>
            body{
                background-color: cyan;
                font-family: Arial, Helvetica, sans-serif;
                padding: 30px;
            }
            h1{
                text-align: center;
                color: hotpink;
                background-color:white;
            }
        
        dl {
            background-color: white;
            width: 600px;
            margin: 30px auto;
            padding: 25px;
            border: 2px solid darkblue;
            border-radius: 12px;
        }

        dt {
            color: darkred;
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
        }

        dd {
            color: #333;
            font-size: 18px;
            background-color: lightyellow;
            padding: 10px;
            border-left: 5px solid orange;
            border-radius: 5px;
            margin-top: 5px;
        }

        dd:hover {
            background-color: lightgreen;
        }

        </style>
    </head>
    <body>
        <h1>
            Description List
        </h1>
    <dl>

    <dt>HTML</dt>
    <dd>HTML is used to create the structure of web pages.</dd>

    <dt>CSS</dt>
    <dd>CSS is used to style web pages.</dd>

    <dt>JavaScript</dt>
    <dd>JavaScript is used to add behavior and interactivity.</dd>

</dl>
        
    </body>
</html>
